version: '3.8'

services:
  zerossg-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zerossg-gateway
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./examples/config.json:/app/config/config.json:ro
      - ./certs:/app/certs:ro
      - ./logs:/var/log/zerossg
      - ./data:/app/data
    environment:
      - ZEROSSG_LOG_LEVEL=info
      - ZEROSSG_LISTEN_PORT=8443
    networks:
      - zerossg-network
    healthcheck:
      test: ["CMD", "zerossg_gateway", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Example internal services for testing
  internal-ssh-server:
    image: linuxserver/openssh-server:latest
    container_name: internal-ssh-server
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PUBLIC_KEY_FILE=/app/certs/ssh_host_rsa_key.pub
    volumes:
      - ./certs/ssh_host_rsa_key.pub:/app/certs/ssh_host_rsa_key.pub:ro
    networks:
      - zerossg-network
    expose:
      - "22"

  internal-web-server:
    image: nginx:alpine
    container_name: internal-web-server
    restart: unless-stopped
    volumes:
      - ./examples/web-content:/usr/share/nginx/html:ro
      - ./certs/web.crt:/etc/nginx/ssl/cert.pem:ro
      - ./certs/web.key:/etc/nginx/ssl/key.pem:ro
    networks:
      - zerossg-network
    expose:
      - "443"

  internal-db-server:
    image: postgres:15-alpine
    container_name: internal-db-server
    restart: unless-stopped
    environment:
      - POSTGRES_DB=zerossg
      - POSTGRES_USER=zerossg
      - POSTGRES_PASSWORD=secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs/db.crt:/var/lib/postgresql/server.crt:ro
      - ./certs/db.key:/var/lib/postgresql/server.key:ro
    networks:
      - zerossg-network
    expose:
      - "5432"

  internal-api-server:
    image: nginx:alpine
    container_name: internal-api-server
    restart: unless-stopped
    volumes:
      - ./examples/api-content:/usr/share/nginx/html:ro
    networks:
      - zerossg-network
    expose:
      - "8080"

  # Monitoring and logging
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - zerossg-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - zerossg-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  zerossg-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
